# Example Apache httpd configuration for QUIC/HTTP3 with Prefork MPM
#
# This demonstrates using mod_http3_prefork_hook.c to add QUIC support
# to the prefork MPM via the accept_function callback mechanism.

ServerRoot "/usr/local/apache2"

# Use prefork MPM
LoadModule mpm_prefork_module modules/mod_mpm_prefork.so

# Load mod_http3 with prefork hooks
LoadModule http3_module modules/mod_http3.so

# Basic modules
LoadModule log_config_module modules/mod_log_config.so
LoadModule unixd_module modules/mod_unixd.so

# Configure QUIC listener
QUICPort 4433
QUICCertificateFile /path/to/server.crt
QUICCertificateKeyFile /path/to/server.key

# Traditional TCP listener
Listen 8080

<VirtualHost *:8080>
    DocumentRoot "/usr/local/apache2/htdocs"
    ServerName example.com
</VirtualHost>

# QUIC/HTTP3 will listen on port 4433 (configured above)
# Both TCP and QUIC listeners will be handled by prefork MPM

# Prefork MPM Configuration
<IfModule mpm_prefork_module>
    StartServers             5
    MinSpareServers          5
    MaxSpareServers         10
    MaxRequestWorkers      150
    MaxConnectionsPerChild   0
</IfModule>

# Logging
ErrorLog "logs/error_log"
LogLevel debug

CustomLog "logs/access_log" combined
